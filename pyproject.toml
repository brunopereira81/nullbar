[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prereg"
version = "0.1.0"
description = "Pre-registration and honest statistics for trading research: trial ledgers, deflated Sharpe, clustered inference, leak detection, fill realism."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bruno Pereira" }]
keywords = ["backtesting", "overfitting", "deflated-sharpe", "pre-registration",
            "quantitative-finance", "leak-detection"]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
