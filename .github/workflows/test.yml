name: tests

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:          # lets an existing tag be published by hand

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pandas is varied EXPLICITLY: the README claims 2.x and 3.x are both
        # tested, and leaving that to pandas' own Python floor made the claim
        # true only by accident — it would break silently the day pandas
        # drops 3.11.
        include:
          - python-version: "3.10"
            pandas: "pandas>=2.0,<3.0"
          - python-version: "3.11"
            pandas: "pandas>=2.0,<3.0"
          - python-version: "3.11"
            pandas: "pandas>=3.0"
          - python-version: "3.12"
            pandas: "pandas>=3.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: pip install "${{ matrix.pandas }}"
      - run: python -c "import pandas, numpy; print(pandas.__version__, numpy.__version__)"
      - run: pytest -q
      - run: python -m nullbar nullbar/ --severity high

  # PyPI trusted publishing (OIDC): no token lives anywhere. The pending
  # publisher on PyPI names THIS workflow file, so the job has to live here.
  publish:
    needs: test                       # never publish a red build
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: pypi                 # narrows the OIDC grant; add required
                                      # reviewers there to gate each release
    permissions:
      id-token: write                 # the OIDC token PyPI verifies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag pyproject=$pkg"
          test "$tag" = "$pkg" || {
            echo "::error::tag $tag does not match pyproject version $pkg"
            exit 1
          }
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
